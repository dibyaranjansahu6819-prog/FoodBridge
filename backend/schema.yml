openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/auth/donor-only/:
    get:
      operationId: auth_donor_only_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/donations/:
    get:
      operationId: donations_list
      parameters:
      - in: query
        name: food_category
        schema:
          type: string
          enum:
          - BAKERY
          - COOKED
          - FRUITS
          - OTHER
          - PACKAGED
        description: |-
          * `COOKED` - Cooked Food
          * `PACKAGED` - Packaged Food
          * `BAKERY` - Bakery
          * `FRUITS` - Fruits & Vegetables
          * `OTHER` - Other
      - in: query
        name: food_type
        schema:
          type: string
          enum:
          - NON_VEG
          - OTHER
          - VEG
          - VEGAN
        description: |-
          * `VEG` - Vegetarian
          * `NON_VEG` - Non-Vegetarian
          * `VEGAN` - Vegan
          * `OTHER` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - AVAILABLE
          - COMPLETED
          - EXPIRED
          - RESERVED
        description: |-
          * `AVAILABLE` - Available
          * `RESERVED` - Reserved
          * `COMPLETED` - Completed
          * `EXPIRED` - Expired
      tags:
      - donations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDonationList'
          description: ''
    post:
      operationId: donations_create
      tags:
      - donations
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Donation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Donation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
          description: ''
  /api/donations/{id}/:
    get:
      operationId: donations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this donation.
        required: true
      tags:
      - donations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
          description: ''
    put:
      operationId: donations_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this donation.
        required: true
      tags:
      - donations
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Donation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Donation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
          description: ''
    patch:
      operationId: donations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this donation.
        required: true
      tags:
      - donations
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDonation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDonation'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
          description: ''
    delete:
      operationId: donations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this donation.
        required: true
      tags:
      - donations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/reservations/:
    get:
      operationId: reservations_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - reservations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
          description: ''
    post:
      operationId: reservations_create
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reservation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reservation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
  /api/reservations/{id}/:
    get:
      operationId: reservations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this reservation.
        required: true
      tags:
      - reservations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
    put:
      operationId: reservations_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this reservation.
        required: true
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reservation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reservation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
    patch:
      operationId: reservations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this reservation.
        required: true
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReservation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReservation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReservation'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
    delete:
      operationId: reservations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this reservation.
        required: true
      tags:
      - reservations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/reservations/{id}/cancel/:
    post:
      operationId: reservations_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this reservation.
        required: true
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reservation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reservation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
  /api/reservations/{id}/complete/:
    post:
      operationId: reservations_complete_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this reservation.
        required: true
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reservation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reservation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Donation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        donor:
          type: string
          readOnly: true
        image:
          type: string
          nullable: true
          readOnly: true
        food_name:
          type: string
          maxLength: 200
        description:
          type: string
        food_type:
          $ref: '#/components/schemas/FoodTypeEnum'
        food_category:
          $ref: '#/components/schemas/FoodCategoryEnum'
        quantity:
          type: string
          maxLength: 100
        servings:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        pickup_start_time:
          type: string
          format: date-time
        expiry_time:
          type: string
          format: date-time
        pickup_address:
          type: string
        contact_number:
          type: string
          maxLength: 15
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/DonationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact_number
      - created_at
      - description
      - donor
      - expiry_time
      - food_name
      - id
      - image
      - pickup_address
      - pickup_start_time
      - quantity
      - servings
      - status
      - updated_at
    DonationStatusEnum:
      enum:
      - AVAILABLE
      - RESERVED
      - COMPLETED
      - EXPIRED
      type: string
      description: |-
        * `AVAILABLE` - Available
        * `RESERVED` - Reserved
        * `COMPLETED` - Completed
        * `EXPIRED` - Expired
    FoodCategoryEnum:
      enum:
      - COOKED
      - PACKAGED
      - BAKERY
      - FRUITS
      - OTHER
      type: string
      description: |-
        * `COOKED` - Cooked Food
        * `PACKAGED` - Packaged Food
        * `BAKERY` - Bakery
        * `FRUITS` - Fruits & Vegetables
        * `OTHER` - Other
    FoodTypeEnum:
      enum:
      - VEG
      - NON_VEG
      - VEGAN
      - OTHER
      type: string
      description: |-
        * `VEG` - Vegetarian
        * `NON_VEG` - Non-Vegetarian
        * `VEGAN` - Vegan
        * `OTHER` - Other
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PaginatedDonationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Donation'
    PaginatedReservationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
    PatchedDonation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        donor:
          type: string
          readOnly: true
        image:
          type: string
          nullable: true
          readOnly: true
        food_name:
          type: string
          maxLength: 200
        description:
          type: string
        food_type:
          $ref: '#/components/schemas/FoodTypeEnum'
        food_category:
          $ref: '#/components/schemas/FoodCategoryEnum'
        quantity:
          type: string
          maxLength: 100
        servings:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        pickup_start_time:
          type: string
          format: date-time
        expiry_time:
          type: string
          format: date-time
        pickup_address:
          type: string
        contact_number:
          type: string
          maxLength: 15
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/DonationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedReservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        donation:
          type: integer
        ngo:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ReservationStatusEnum'
          readOnly: true
        reserved_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 15
        organization_name:
          type: string
          nullable: true
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - full_name
      - password
    Reservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        donation:
          type: integer
        ngo:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ReservationStatusEnum'
          readOnly: true
        reserved_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - donation
      - id
      - ngo
      - reserved_at
      - status
      - updated_at
    ReservationStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - CANCELLED
      - COMPLETED
      type: string
      description: |-
        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
        * `COMPLETED` - Completed
    RoleEnum:
      enum:
      - DONOR
      - NGO
      - ADMIN
      type: string
      description: |-
        * `DONOR` - Donor
        * `NGO` - NGO
        * `ADMIN` - Admin
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 15
        organization_name:
          type: string
          nullable: true
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_verified:
          type: boolean
      required:
      - email
      - full_name
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
